{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Todo{% endblock %}</title>
    {% block extra_css %}{% endblock %}
    <link rel="icon"
      type="image/png"
      href="{% static 'images/logo_todo.png' %}">
</head>
<body>
    {% block body %}
    {% endblock %}
    {% block extra_js %}
    {% endblock %}
</body>
</html>
